
name: Docker CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the source code
        uses: actions/checkout@v4

      - name: Check Docker version
        run: docker --version

      - name: Build Docker image
        run: docker build -f dockerfile -t web-container:v1 .
